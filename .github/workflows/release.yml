name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_latest:
        description: "Also publish mutable latest Docker tags"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref_name }}
      PUBLISH_LATEST: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.publish_latest) }}
      GHCR_OWNER: ${{ github.repository_owner }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Prepare
        run: |
          mkdir -p "$GOCACHE" dist
          chmod +x packaging/scripts/postinstall.sh packaging/scripts/postremove.sh

      - name: GoReleaser (deb/rpm + GitHub Release assets)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.15.4
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build & push docker images
        env:
          DOCKERHUB_NAMESPACE: ${{ env.DOCKERHUB_USERNAME }}
        run: |
          set -eu

          ghcr_controller="ghcr.io/${GHCR_OWNER}/arca-dns-controller"
          ghcr_agent="ghcr.io/${GHCR_OWNER}/arca-dns-agent"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          tags_controller="--tag ${ghcr_controller}:${TAG}"
          tags_agent="--tag ${ghcr_agent}:${TAG}"
          if [ "${PUBLISH_LATEST:-false}" = "true" ]; then
            tags_controller="${tags_controller} --tag ${ghcr_controller}:latest"
            tags_agent="${tags_agent} --tag ${ghcr_agent}:latest"
          fi

          if [ -n "${DOCKERHUB_NAMESPACE:-}" ]; then
            hub_controller="docker.io/${DOCKERHUB_NAMESPACE}/arca-dns-controller"
            hub_agent="docker.io/${DOCKERHUB_NAMESPACE}/arca-dns-agent"
            tags_controller="${tags_controller} --tag ${hub_controller}:${TAG}"
            tags_agent="${tags_agent} --tag ${hub_agent}:${TAG}"
            if [ "${PUBLISH_LATEST:-false}" = "true" ]; then
              tags_controller="${tags_controller} --tag ${hub_controller}:latest"
              tags_agent="${tags_agent} --tag ${hub_agent}:latest"
            fi
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deployments/docker/Dockerfile.controller \
            --build-arg VERSION="${TAG}" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg DATE="${build_date}" \
            ${tags_controller} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.version="${TAG}" \
            --metadata-file dist/docker-controller.json \
            --push \
            .

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deployments/docker/Dockerfile.agent \
            --build-arg VERSION="${TAG}" \
            --build-arg COMMIT="${{ github.sha }}" \
            --build-arg DATE="${build_date}" \
            ${tags_agent} \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.version="${TAG}" \
            --metadata-file dist/docker-agent.json \
            --push \
            .

          {
            echo "tag=${TAG}"
            echo "publish_latest=${PUBLISH_LATEST}"
            echo "ghcr_controller=${ghcr_controller}"
            echo "ghcr_agent=${ghcr_agent}"
            if [ -n "${DOCKERHUB_NAMESPACE:-}" ]; then
              echo "dockerhub_controller=${hub_controller}"
              echo "dockerhub_agent=${hub_agent}"
            else
              echo "dockerhub=disabled (missing DOCKERHUB_USERNAME/DOCKERHUB_TOKEN)"
            fi
          } > dist/docker-images.txt

      - name: Attach docker metadata to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/docker-images.txt
            dist/docker-controller.json
            dist/docker-agent.json
