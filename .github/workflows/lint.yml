name: lint

on:
  pull_request:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOPATH: ${{ github.workspace }}/.cache/gopath
      GOMODCACHE: ${{ github.workspace }}/.cache/gomod
      GOLANGCI_LINT_CACHE: ${{ github.workspace }}/.cache/golangci-lint
    steps:
      - uses: actions/checkout@v7

      - id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: golangci-lint
        run: |
          mkdir -p "$GOCACHE"
          make install-tools lint
