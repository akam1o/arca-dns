version: 2

project_name: arca-dns

builds:
  - id: arca-dns-controller
    main: ./cmd/arca-dns-controller
    binary: arca-dns-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: arca-dns-agent
    main: ./cmd/arca-dns-agent
    binary: arca-dns-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

nfpms:
  - id: arca-dns
    package_name: arca-dns
    ids:
      - arca-dns-controller
      - arca-dns-agent
    vendor: Arca Project
    homepage: https://github.com/akam1o/arca-dns
    maintainer: Arca Project <arca-project@ark-networks.net>
    description: BGP Anycast + ECMP authoritative DNS with split control/data plane
    license: Apache-2.0
    dependencies:
      - nsd
      - unbound
    overrides:
      deb:
        dependencies:
          - nsd
          - unbound
          - bird2
      rpm:
        dependencies:
          - nsd
          - unbound
          - bird
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    section: net
    priority: optional
    contents:
      - src: ./packaging/systemd/arca-dns-controller.service
        dst: /usr/lib/systemd/system/arca-dns-controller.service
      - src: ./packaging/systemd/arca-dns-agent.service
        dst: /usr/lib/systemd/system/arca-dns-agent.service

      - src: ./configs/controller.example.yaml
        dst: /etc/arca-dns/controller.yaml
        type: config
      - src: ./configs/agent.example.yaml
        dst: /etc/arca-dns/agent.yaml
        type: config

      - src: ./packaging/sysusers.d/arca-dns.conf
        dst: /usr/lib/sysusers.d/arca-dns.conf
      - src: ./packaging/tmpfiles.d/arca-dns.conf
        dst: /usr/lib/tmpfiles.d/arca-dns.conf

      - src: ./migrations/mysql/000001_initial_schema.up.sql
        dst: /usr/share/arca-dns/migrations/mysql/000001_initial_schema.up.sql
      - src: ./migrations/mysql/000001_initial_schema.down.sql
        dst: /usr/share/arca-dns/migrations/mysql/000001_initial_schema.down.sql
      - src: ./migrations/postgres/000001_initial_schema.up.sql
        dst: /usr/share/arca-dns/migrations/postgres/000001_initial_schema.up.sql
      - src: ./migrations/postgres/000001_initial_schema.down.sql
        dst: /usr/share/arca-dns/migrations/postgres/000001_initial_schema.down.sql
      - src: ./migrations/postgres/000002_widen_soa_intervals.up.sql
        dst: /usr/share/arca-dns/migrations/postgres/000002_widen_soa_intervals.up.sql
      - src: ./migrations/postgres/000002_widen_soa_intervals.down.sql
        dst: /usr/share/arca-dns/migrations/postgres/000002_widen_soa_intervals.down.sql
      - src: ./migrations/sqlite/000001_initial_schema.up.sql
        dst: /usr/share/arca-dns/migrations/sqlite/000001_initial_schema.up.sql
      - src: ./migrations/sqlite/000001_initial_schema.down.sql
        dst: /usr/share/arca-dns/migrations/sqlite/000001_initial_schema.down.sql

    scripts:
      postinstall: ./packaging/scripts/postinstall.sh
      postremove: ./packaging/scripts/postremove.sh

archives:
  - id: default
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  disable: false
