# Example configuration for arca-dns-agent

controller:
  url: "http://controller:8080"
  api_key: "REPLACE_WITH_RAW_API_KEY"
  timeout: "5s"
  retry_attempts: 3
  retry_delay: "200ms"

sync:
  sync_interval: "30s"
  jitter: "5s"
  max_staleness: "5m"
  backup_versions: 3
  verify_checksums: true
  verify_signatures: false
  # Required when verify_signatures is true.
  controller_public_key: ""

health:
  check_interval: "10s"
  failure_threshold: 3
  recovery_threshold: 5
  query_timeout: "2s"
  latency_threshold: "100ms"
  # DNS check targets (host:port)
  nsd_server: "127.0.0.1:5353"
  unbound_server: "127.0.0.1:53"
  test_record: "example.com"

nsd:
  enabled: false
  config_path: "/etc/nsd/nsd.conf"
  control_path: "/usr/sbin/nsd-control"
  zone_directory: "/var/lib/nsd/zones"
  checkzone_path: "/usr/sbin/nsd-checkzone"
  reload_timeout: "10s"

unbound:
  enabled: false
  config_path: "/etc/unbound/unbound.conf"
  control_path: "/usr/sbin/unbound-control"
  checkconf_path: "/usr/sbin/unbound-checkconf"
  edns_buffer_size: 1232
  stub_zone:
    nsd_address: "127.0.0.1"
    nsd_port: 5353
  reload_timeout: "10s"

bird:
  enabled: false
  socket_path: "/var/run/bird/bird.ctl"
  command_timeout: "5s"

  # Protocols to control (enable/disable) based on health.
  # This is the recommended config surface (explicit name + neighbor).
  protocols:
    - name: "anycast_1"
      neighbor_address: "10.0.0.1"
      neighbor_asn: 64512
    - name: "anycast_2"
      neighbor_address: "10.0.0.2"
      neighbor_asn: 64512

  # Legacy (still supported): protocol_name/protocol_names for enable/disable only.
  # protocol_name: "anycast"
  # protocol_names: ["anycast_1", "anycast_2"]

  # Anycast prefixes to advertise (used for config generation below; optional if you manage bird.conf yourself)
  anycast_prefixes:
    - "192.0.2.53/32"
    - "2001:db8::53/128"

  # Health → route decision thresholds (defaults match current behavior)
  state_machine:
    failure_threshold: 3
    recovery_threshold: 3
    min_state_duration: "30s"

  # Optional: generate a BIRD config snippet at startup and run "configure".
  # This provides a config surface similar to ip-anycast-service (router_id/local_as/source_ip/neighbors/BFD).
  # Your main bird.conf must include this file, e.g.:
  #   include "/etc/bird/arca-dns-anycast.conf";
  config:
    enabled: false
    path: "/etc/bird/arca-dns-anycast.conf"
    router_id: "10.0.0.5"
    local_as: 65001
    source_ip: "10.0.0.5"
    # Legacy (still supported): if bird.protocols is empty, neighbors are used to generate bgp protocols.
    neighbors: []
    bfd:
      enabled: true
      min_rx: "300ms"
      min_tx: "300ms"
      multiplier: 5

dnstap:
  enabled: false
  socket_path: "/var/run/dnstap.sock"
  log_file: "/var/log/arca-dns/dnstap.jsonl"
  sample_rate: 10
  always_log_errors: true
  buffer_size: 1000
  log_rotation:
    max_size: 100
    max_age: 7
    max_backups: 10
    compress: true

metrics:
  enabled: true
  listen: "0.0.0.0:9090"

logging:
  level: "info"
  format: "json"
  output: "stdout"
