# Example configuration for arca-dns-controller

api:
  listen: "0.0.0.0:8080"
  # HMAC key for X-Zone-Signature on signed zone artifacts.
  # Required when api.auth.enabled is true. Agents that enable
  # sync.verify_signatures must use the same shared secret in sync.controller_signature_key.
  # Generate with: openssl rand -base64 32
  artifact_signature_key: "REPLACE_WITH_SHARED_SIGNATURE_KEY"
  trusted_proxies: [] # e.g. ["10.0.0.0/8", "192.168.0.0/16"]; do not use 0.0.0.0/0 or ::/0
  auth:
    # The built-in default is true. When enabled, at least one valid API key
    # hash is required; otherwise the controller exits during config validation.
    # Set enabled: false only for intentionally unauthenticated local setups.
    enabled: true
    api_keys:
      # Generate: echo -n 'your-api-key' | sha256sum
      # Then prefix with "sha256:".
      admin: "sha256:REPLACE_WITH_SHA256_HEX"
      agent: "sha256:REPLACE_WITH_AGENT_SHA256_HEX"
    api_key_roles:
      admin: "admin"
      agent: "agent"
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

observability:
  # Prometheus metrics are served here, separate from the API listener.
  # Health/readiness/status endpoints are served on the API listener.
  # Bind to 0.0.0.0 only behind network controls and with auth_token set.
  listen: "127.0.0.1:9053"
  # Required when listen is not loopback. Protects /status and /metrics.
  # Generate with: openssl rand -base64 32
  auth_token: ""

backend:
  type: "sqlite" # sqlite|postgres|mysql|git|etcd
  sqlite:
    dsn: "file:/var/lib/arca-dns/arca-dns.db" # controller config must use a file-backed database
  postgres:
    dsn: "postgres://user:pass@localhost:5432/arca_dns?sslmode=disable"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"
  mysql:
    dsn: "root:pass@tcp(mysql:3306)/arca_dns?parseTime=true"
    max_open_conns: 25
    max_idle_conns: 5
    conn_max_lifetime: "5m"
  git:
    repository_path: "/var/lib/arca-dns/git"
    remote_url: ""
    branch: "main"
    author: "arca-dns-controller"
    email: "noreply@arca-dns"
    auto_push: false
    auto_pull: false
    pull_interval: "1m"
  etcd:
    endpoints: ["etcd:2379"]
    prefix: "/arca-dns"
    dial_timeout: "5s"
    request_timeout: "10s"

storage:
  artifact_directory: "/var/lib/arca-dns/artifacts"
  # storage.key_directory is a deprecated alias; use dnssec.key_directory.
  max_versions_per_zone: 10

dnssec:
  enabled: true
  algorithm: 13 # 13=ECDSA-P256, 8=RSA-SHA256
  key_directory: "/var/lib/arca-dns/keys"
  signature_validity: "720h" # 30d
  signature_inception: "1h"
  resign_threshold: "168h" # 7d
  nsec3: true
  nsec3_iterations: 1
  nsec3_salt_length: 8
  scheduler_enabled: true
  scheduler_check_interval: "1h"
  master_key_auto_generate: false

logging:
  level: "info"
  format: "json"
  output: "stdout"
