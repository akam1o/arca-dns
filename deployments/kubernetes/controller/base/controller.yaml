api:
  listen: "0.0.0.0:8080"
  trusted_proxies: []
  auth:
    # Replace the placeholder before deployment. When auth is enabled, at least
    # one valid sha256:<64-hex> API key hash is required at startup.
    # The base Deployment overrides admin from the arca-dns-secrets api-key-hash.
    enabled: true
    api_keys:
      admin: "sha256:REPLACE_WITH_SHA256_HEX"
      agent: "sha256:REPLACE_WITH_AGENT_SHA256_HEX"
    api_key_roles:
      admin: "admin"
      agent: "agent"
  rate_limit:
    enabled: true
    requests_per_second: 100
    burst: 200

observability:
  listen: "127.0.0.1:9053"

# Kubernetes "production-ish" default: external/HA etcd.
# Set endpoints to your managed/HA etcd cluster.
backend:
  type: "etcd"
  etcd:
    endpoints: ["http://REPLACE_WITH_ETCD_ENDPOINT:2379"]
    prefix: "/arca-dns"
    dial_timeout: "5s"
    request_timeout: "10s"

storage:
  artifact_directory: "/var/lib/arca-dns/artifacts"
  key_directory: "/var/lib/arca-dns/keys"
  max_versions_per_zone: 10

dnssec:
  enabled: true
  algorithm: 13
  key_directory: "/var/lib/arca-dns/keys"
  signature_validity: "720h"
  signature_inception: "1h"
  resign_threshold: "168h"
  nsec3: true
  nsec3_iterations: 1
  nsec3_salt_length: 8
  scheduler_enabled: true
  scheduler_check_interval: "1h"
  master_key_auto_generate: false

logging:
  level: "info"
  format: "json"
  output: "stdout"
