services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arca_dns
      MYSQL_USER: dns_user
      MYSQL_PASSWORD: dnspassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations/mysql/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/000001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  controller-data-init:
    image: busybox:1.36
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/arca-dns/artifacts /var/lib/arca-dns/keys
        chown -R 65532:65532 /var/lib/arca-dns
    volumes:
      - controller_data:/var/lib/arca-dns

  controller:
    image: ghcr.io/akam1o/arca-dns-controller:latest
    ports:
      - "8080:8080"
      # Metrics require ARCA_DNS_OBSERVABILITY_AUTH_TOKEN.
      - "127.0.0.1:9053:9053"
    environment:
      # Set before running:
      #   export ARCA_DNS_API_KEY_HASH="sha256:<64-hex>"
      #   export ARCA_DNS_AGENT_API_KEY_HASH="sha256:<64-hex>"
      #   export ARCA_DNS_DNSSEC_MASTER_KEY_B64="$(openssl rand -base64 32)"
      #   export ARCA_DNS_API_ARTIFACT_SIGNATURE_KEY="$(openssl rand -base64 32)"
      #   export ARCA_DNS_OBSERVABILITY_AUTH_TOKEN="$(openssl rand -base64 32)"
      ARCA_DNS_API_AUTH_API_KEYS_ADMIN: "${ARCA_DNS_API_KEY_HASH:?set ARCA_DNS_API_KEY_HASH}"
      ARCA_DNS_API_AUTH_API_KEYS_AGENT: "${ARCA_DNS_AGENT_API_KEY_HASH:?set ARCA_DNS_AGENT_API_KEY_HASH}"
      ARCA_DNS_DNSSEC_MASTER_KEY_B64: "${ARCA_DNS_DNSSEC_MASTER_KEY_B64:?set ARCA_DNS_DNSSEC_MASTER_KEY_B64}"
      ARCA_DNS_API_ARTIFACT_SIGNATURE_KEY: "${ARCA_DNS_API_ARTIFACT_SIGNATURE_KEY:?set ARCA_DNS_API_ARTIFACT_SIGNATURE_KEY}"
      ARCA_DNS_OBSERVABILITY_AUTH_TOKEN: "${ARCA_DNS_OBSERVABILITY_AUTH_TOKEN:?set ARCA_DNS_OBSERVABILITY_AUTH_TOKEN}"
    volumes:
      # Run with: docker compose -f deployments/compose/controller-mysql/docker-compose.yaml --project-directory . up
      - ./deployments/compose/controller-mysql/controller.yaml:/etc/arca-dns/controller.yaml:ro
      - controller_data:/var/lib/arca-dns
    depends_on:
      mysql:
        condition: service_healthy
      controller-data-init:
        condition: service_completed_successfully
    command: ["serve", "--config", "/etc/arca-dns/controller.yaml"]

volumes:
  mysql_data: {}
  controller_data: {}
